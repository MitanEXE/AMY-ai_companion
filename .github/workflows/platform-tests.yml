name: AMY platform tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-windows.txt
          .\Start-AMY.cmd --help
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Install Ubuntu Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1
      - name: Install Linux Python dependencies
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-desktop.txt Pillow
      - name: Run Linux tests
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
